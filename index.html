<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; overflow-x: hidden; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", system-ui, sans-serif;
    color: #3a0028;
    background:
      radial-gradient(ellipse at 20% 0%, #ffd6ec 0%, transparent 55%),
      radial-gradient(ellipse at 80% 100%, #ff8ec8 0%, transparent 55%),
      linear-gradient(155deg, #ffd6ec 0%, #ffb0d8 45%, #ff8ec8 100%);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    position: relative;
    overflow: hidden;
  }

  .sparkle {
    position: absolute;
    pointer-events: none;
    color: #ffffff;
    text-shadow: 0 0 8px rgba(255, 79, 163, 0.6);
    animation: twinkle 2.4s ease-in-out infinite;
    user-select: none;
    font-size: 24px;
  }
  .sparkle.s1 { top: 8%; left: 12%; font-size: 28px; animation-delay: 0s; }
  .sparkle.s2 { top: 14%; right: 18%; font-size: 18px; animation-delay: 0.4s; }
  .sparkle.s3 { top: 35%; left: 6%; font-size: 22px; animation-delay: 0.9s; }
  .sparkle.s4 { bottom: 22%; right: 8%; font-size: 30px; animation-delay: 1.2s; }
  .sparkle.s5 { bottom: 12%; left: 22%; font-size: 20px; animation-delay: 1.8s; }
  .sparkle.s6 { top: 60%; right: 30%; font-size: 16px; animation-delay: 0.6s; }
  @keyframes twinkle {
    0%, 100% { opacity: 0.3; transform: scale(0.8) rotate(0deg); }
    50% { opacity: 1; transform: scale(1.15) rotate(20deg); }
  }

  .card {
    background: rgba(255, 255, 255, 0.65);
    backdrop-filter: blur(20px) saturate(180%);
    -webkit-backdrop-filter: blur(20px) saturate(180%);
    border: 1.5px solid rgba(255, 255, 255, 0.9);
    border-radius: 32px;
    padding: 40px 32px 32px;
    max-width: 420px;
    width: 100%;
    box-shadow:
      0 30px 60px -20px rgba(233, 30, 99, 0.35),
      0 8px 20px -8px rgba(156, 14, 74, 0.2),
      inset 0 1px 0 rgba(255, 255, 255, 1);
    text-align: center;
    position: relative;
    z-index: 2;
  }

  .icon-wrap {
    width: 120px;
    height: 120px;
    margin: 0 auto 22px;
    border-radius: 28px;
    overflow: hidden;
    box-shadow:
      0 16px 32px -8px rgba(233, 30, 99, 0.5),
      0 0 0 1.5px rgba(255, 255, 255, 0.9);
    transform: rotate(-3deg);
    transition: transform 0.3s ease;
  }
  .icon-wrap:hover { transform: rotate(0deg) scale(1.04); }
  .icon-wrap img { width: 100%; height: 100%; display: block; }

  h1 {
    font-size: 56px;
    font-weight: 900;
    letter-spacing: -0.04em;
    background: linear-gradient(135deg, #c2185b 0%, #e91e63 50%, #ff5e9e 100%);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    line-height: 0.95;
    margin-bottom: 8px;
  }

  .tagline {
    font-size: 17px;
    font-weight: 600;
    color: #9c0e4a;
    margin-bottom: 28px;
    letter-spacing: -0.01em;
  }

  .buttons {
    display: flex;
    flex-direction: column;
    gap: 12px;
    margin-bottom: 18px;
  }

  .store-btn {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    padding: 16px 24px;
    border-radius: 18px;
    text-decoration: none;
    font-weight: 700;
    font-size: 16px;
    transition: transform 0.15s ease, box-shadow 0.15s ease;
    border: none;
    cursor: pointer;
    position: relative;
  }
  .store-btn:active { transform: scale(0.97); }

  .store-btn.ios {
    background: linear-gradient(180deg, #000000 0%, #1a1a1a 100%);
    color: #ffffff;
    box-shadow: 0 8px 20px -6px rgba(0,0,0,0.35);
  }
  .store-btn.android {
    background: linear-gradient(180deg, #ffffff 0%, #fff0f7 100%);
    color: #3a0028;
    box-shadow: 0 8px 20px -6px rgba(233, 30, 99, 0.25);
    border: 1.5px solid rgba(233, 30, 99, 0.15);
  }
  .store-btn.recommended {
    box-shadow:
      0 0 0 3px rgba(255, 255, 255, 0.9),
      0 0 0 5px #e91e63,
      0 12px 28px -6px rgba(233, 30, 99, 0.5);
    transform: translateY(-2px);
  }
  .store-btn.recommended::after {
    content: "★ for you";
    position: absolute;
    top: -10px;
    right: 14px;
    background: linear-gradient(135deg, #ff5e9e, #c2185b);
    color: white;
    font-size: 11px;
    font-weight: 800;
    padding: 4px 10px;
    border-radius: 999px;
    letter-spacing: 0.04em;
    box-shadow: 0 4px 10px -2px rgba(156, 14, 74, 0.6);
  }
  .store-btn .logo { width: 22px; height: 22px; flex-shrink: 0; }
  .store-btn .text { display: flex; flex-direction: column; align-items: flex-start; line-height: 1.1; }
  .store-btn .text .small { font-size: 10px; opacity: 0.7; font-weight: 600; letter-spacing: 0.05em; }
  .store-btn .text .big { font-size: 17px; font-weight: 800; }

  .footer-note {
    font-size: 12px;
    color: rgba(58, 0, 40, 0.55);
    margin-top: 16px;
    line-height: 1.6;
  }
  .footer-note a {
    color: #c2185b;
    text-decoration: none;
    font-weight: 600;
  }
  .footer-note a:hover { text-decoration: underline; }

  @media (max-width: 420px) {
    .card { padding: 32px 24px 24px; border-radius: 28px; }
    h1 { font-size: 48px; }
    .icon-wrap { width: 100px; height: 100px; }
  }
</style>
</head>
